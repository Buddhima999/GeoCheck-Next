name: MongoDB integration tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongodb-integration:
    name: Real MongoDB queue and replay tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run live MongoDB integration tests
        env:
          GEOCHECK_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: python -m unittest discover -s backend/tests -p "test_mongodb_integration.py" -v

      - name: Smoke-test synthetic benchmark with MongoDB
        env:
          GEOCHECK_BENCH_MONGO_URI: mongodb://127.0.0.1:27017
        run: python backend/scripts/benchmark_validation.py --rows 1000 --dp-count 250 --batch-size 100
