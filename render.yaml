services:
  - type: web
    name: geocheck-api-worker
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 300
    autoDeploy: true
    disk:
      name: geocheck-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: geocheck_next
      - key: GEOCHECK_API_KEY
        sync: false
      - key: API_CORS_ORIGINS
        value: https://geo-check-next-frontend.vercel.app
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: REFERENCE_DATA_DIR
        value: reference-data
      - key: RUN_CSV_WORKER
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "536870912"
      - key: MAX_CSV_ROWS
        value: "1000000"
