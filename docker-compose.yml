name: geocheck-next

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - geocheck_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: geocheck_next
      API_CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /data/uploads
      REFERENCE_DATA_DIR: /app/reference-data
    volumes:
      - geocheck_uploads:/data/uploads
      - ./backend/reference-data:/app/reference-data:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: geocheck_next
      UPLOAD_DIR: /data/uploads
      REFERENCE_DATA_DIR: /app/reference-data
    volumes:
      - geocheck_uploads:/data/uploads
      - ./backend/reference-data:/app/reference-data:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; raise SystemExit(0 if os.path.exists('/proc/1/cmdline') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  geocheck_mongodb:
  geocheck_uploads:
