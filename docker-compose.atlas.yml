name: geocheck-next-atlas

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the root .env file}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-geocheck_next}
      UPLOAD_DIR: /data/uploads
      REFERENCE_DATA_DIR: /app/reference-data
    volumes:
      - geocheck_uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the root .env file}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-geocheck_next}
      UPLOAD_DIR: /data/uploads
      REFERENCE_DATA_DIR: /app/reference-data
    volumes:
      - geocheck_uploads:/data/uploads

volumes:
  geocheck_uploads:
